name: Deploy VocabularyApp to GitHub Pages

on:
  push:
    branches: [main, 'codex/**']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and data tests
        run: npm test
      - name: Worker runtime and shared quota tests
        run: npm run test:worker
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Worker deploy preparation (no deployment)
        run: npm run proxy:check
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Install test browser
        run: npx playwright install --with-deps chrome
      - name: Development browser tests
        run: npm run test:e2e
      - name: Translation browser tests (controlled upstream)
        run: npm run test:translation
      - name: Translation production subpath tests (controlled upstream)
        run: npm run test:translation:preview
      - name: Build
        run: npm run build
        env:
          VITE_TRANSLATION_API_BASE_URL: ${{ vars.VITE_TRANSLATION_API_BASE_URL }}
      - name: Server secret isolation build
        run: npm run check:secrets
        env:
          VITE_TRANSLATION_API_BASE_URL: ${{ vars.VITE_TRANSLATION_API_BASE_URL }}
      - name: Production subpath and migration tests
        run: npm run test:pages
      - name: Check static artifact contents
        run: npm run check:dist
      - name: Upload only static dist
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
